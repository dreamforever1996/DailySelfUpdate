# HTTPS overlay. Use TOGETHER with the base prod file:
#   docker compose -f docker-compose.prod.yml -f docker-compose.caddy.yml --env-file .env up -d --build
#
# Caddy terminates HTTPS and proxies to all services on the shared Docker network.
# AIInfra services join via the external network "aiinfra_default" (created when
# you start AIInfraLearning with docker compose -f docker-compose.prod.yml up -d).
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required (your domain, optionally :port)}
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - default
      - aiinfra_net

volumes:
  caddy-data:
  caddy-config:

networks:
  aiinfra_net:
    external: true
    # Created by AIInfraLearning stack. Run once to create it:
    #   docker network create aiinfra_net
    # Then start AIInfraLearning with: --network aiinfra_net (see its docker-compose.prod.yml)
